name: iOS

on:
  push:
    branches: [master]
    paths: ["ios/**", "fixtures/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "fixtures/**", ".github/workflows/ios.yml"]

jobs:
  dsp-linux:
    # Shared DSP on the reference DFT, checked against fixtures/dsp.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: DSP tests (reference DFT)
        working-directory: ios/FourierDSP
        run: swift test

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: DSP tests (Accelerate and reference)
        working-directory: ios/FourierDSP
        run: swift test
      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build app (device, unsigned)
        working-directory: ios
        run: |
          xcodebuild build \
            -project FourierFilterCam.xcodeproj \
            -scheme FourierFilterCam \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
