# XcodeGen spec. The .xcodeproj is generated, not committed:
#   brew install xcodegen && cd ios && xcodegen generate
name: FourierFilterCam
options:
  bundleIdPrefix: com.phillyberk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  FourierDSP:
    path: FourierDSP
targets:
  FourierFilterCam:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: FourierFilterCam
    dependencies:
      - package: FourierDSP
    info:
      path: FourierFilterCam/Info.plist
      properties:
        CFBundleDisplayName: Fourier Filter Cam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarHidden: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Fourier Filter Cam filters the live camera image in the frequency domain. Frames never leave the device.
        NSPhotoLibraryAddUsageDescription: Saves the filtered image to your photo library as a lossless PNG.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phillyberk.fourierfiltercamera
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
    scheme: {}
